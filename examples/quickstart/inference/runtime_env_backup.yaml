working_dir: ./
excludes:
  - "/.git/"

pip:
  packages:
    - "modal"

env_vars:
  NCCL_SOCKET_IFNAME: "bond3"
  NCCL_SOCKET_FAMILY: "AF_INET"
  # NCCL_NET: "IB"
  NCCL_IB_DISABLE: "1"
  NCCL_DEBUG: "INFO"
  PYTHONPATH: "verl"
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_DISABLE_COMPILE_CACHE: "1"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"

  # if you use vefaas, set the following variables
  VEFAAS_FUNCTION_ID: "xxxxxx"
  VEFAAS_FUNCTION_ROUTE: "xxxxxx"
  VOLCE_ACCESS_KEY: "xxxxxx"
  VOLCE_SECRET_KEY: "xxxxxx"

  # if you use modal, set the following variables
  MODAL_TOKEN_ID: "<modal-token-id>"
  MODAL_TOKEN_SECRET: "<modal-token-secret>"

  # if you use other model serving services
  # ......
